<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>🍀 今日锦鲤</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 50% 20%,#1a472a,#0a1f0a,#000);color:#e8f5e9;font-family:-apple-system,"PingFang SC",sans-serif;min-height:100vh;padding:20px;display:flex;flex-direction:column;align-items:center}
.header{width:100%;max-width:480px;display:flex;justify-content:space-between;margin-bottom:20px}
.header h1{color:#66bb6a;font-size:22px}
.header a{color:#81c784;text-decoration:none;font-size:14px}
.card{max-width:480px;width:100%;background:rgba(0,50,0,.4);border:2px solid #4caf50;border-radius:20px;padding:40px 24px;text-align:center;box-shadow:0 0 40px rgba(76,175,80,.4)}
.icon{font-size:100px;margin-bottom:20px;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.date{color:#a5d6a7;font-size:14px;margin-bottom:16px}
.winner{font-size:32px;font-weight:900;color:#ffd54f;margin-bottom:12px;text-shadow:0 0 20px rgba(255,213,79,.6)}
.desc{color:#c8e6c9;font-size:15px;line-height:1.6;margin-bottom:24px}
.btn{padding:12px 32px;border:none;border-radius:30px;background:linear-gradient(135deg,#4caf50,#2e7d32);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.97)}
</style></head><body>
<div class="header"><h1>🍀 今日锦鲤</h1><a href="/">← 返回</a></div>
<div class="card">
<div class="icon">🍀</div>
<div class="date" id="date">加载中...</div>
<div class="winner" id="winner">...</div>
<div class="desc" id="desc">每天 8:00 自动抽一位锦鲤，当天花橘子 9 折！</div>
<button class="btn" id="pickBtn" style="display:none" onclick="__pick()">抽今日锦鲤</button>
</div>
<script>
const token=localStorage.getItem('token');if(!token)location.href='/';
async function load(){const d=await fetch('/api/koi/today',{headers:{Authorization:token}}).then(r=>r.json());if(d.ok&&d.koi){document.getElementById('date').textContent='📅 '+d.koi.date;document.getElementById('winner').textContent='🎉 '+d.koi.displayName;}}
window.__pick=async function(){const d=await fetch('/api/koi/pick',{method:'POST',headers:{Authorization:token}}).then(r=>r.json());if(d.ok){load();}else alert(d.msg);};
load();
setInterval(load,30000);
</script></body></html>
