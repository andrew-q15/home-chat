<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌐 橘域网 - 自动化地图构建</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #fff; font-family: ui-monospace, Menlo, Consolas, monospace; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .bg-grid { position: absolute; inset: -50%; background-image: linear-gradient(to right, rgba(46, 204, 64, 0.1) 1px, transparent 1px), linear-gradient(to bottom, rgba(46, 204, 64, 0.1) 1px, transparent 1px); background-size: 40px 40px; transform: perspective(500px) rotateX(60deg); animation: gridMove 10s linear infinite; z-index: 1; }
  @keyframes gridMove { 0% { transform: perspective(500px) rotateX(60deg) translateY(0); } 100% { transform: perspective(500px) rotateX(60deg) translateY(40px); } }
  .content { position: relative; z-index: 10; text-align: center; padding: 20px; max-width: 400px; }
  .glitch-title { font-size: 32px; font-weight: 900; color: #2ecc71; margin-bottom: 16px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(46, 204, 64, 0.5); animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  .subtitle { font-size: 14px; color: #aaa; line-height: 1.6; margin-bottom: 40px; }
  .subtitle span { color: #3498db; font-weight: bold; }
  .btn-group { display: flex; flex-direction: column; gap: 16px; width: 100%; }
  .cyber-btn { position: relative; padding: 16px 20px; background: rgba(0,0,0,0.8); border: 1px solid #2ecc71; color: #2ecc71; font-size: 16px; font-weight: bold; font-family: inherit; cursor: pointer; overflow: hidden; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px; }
  .cyber-btn:hover { background: #2ecc71; color: #000; box-shadow: 0 0 20px rgba(46, 204, 64, 0.6); }
  .cyber-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: left 0.5s; }
  .cyber-btn:hover::before { left: 100%; }
  .btn-join { border-color: #3498db; color: #3498db; }
  .btn-join:hover { background: #3498db; box-shadow: 0 0 20px rgba(52, 152, 219, 0.6); }
  .back-link { margin-top: 30px; color: #666; text-decoration: none; font-size: 13px; transition: color 0.2s; display: inline-block; }
  .back-link:hover { color: #fff; }
  #loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
  .spinner { width: 40px; height: 40px; border: 4px solid rgba(46, 204, 64, 0.3); border-top-color: #2ecc71; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
  <script src="/esc.js"></script>
</head>
<body>
<div class="bg-grid"></div>
<div class="content">
  <div class="glitch-title">AUTO_MAPPING</div>
  <div class="subtitle">
    节点扫描协议已启动。<br>
    我们的目标是：构建 <span>橘域网</span> 专属的赛博路网。<br>
    你的每一次移动，都会成为数据的一部分。
  </div>
  <div class="btn-group">
    <button class="cyber-btn" onclick="__requestLocation('map')">🗺️ 进入赛博地图</button>
    <button class="cyber-btn btn-join" onclick="__requestLocation('track')">📡 加入自动地图数据收集</button>
  </div>
  <a href="/" class="back-link">← 取消并返回聊天室</a>
</div>
<div id="loading-overlay">
  <div class="spinner"></div>
  <div style="color:#2ecc71;font-size:14px;">正在连接卫星...</div>
</div>
<script>
function __requestLocation(action) {
  const overlay = document.getElementById('loading-overlay');
  overlay.style.display = 'flex';
  if (!navigator.geolocation) {
    alert('你的设备不支持定位功能，只能进入手动模式地图。');
    overlay.style.display = 'none';
    window.location.href = '/map.html';
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      overlay.style.display = 'none';
      if (action === 'map') window.location.href = '/map.html';
      else window.location.href = '/map.html?autotrack=1';
    },
    (err) => {
      overlay.style.display = 'none';
      alert('定位失败或权限被拒绝。你将被带到手动模式。');
      window.location.href = '/map.html';
    },
    { enableHighAccuracy: true, timeout: 5000 }
  );
}
</script>
</body>
</html>
