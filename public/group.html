<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎲 抽签分组</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #e2e8f0; font-family: -apple-system, "PingFang SC", sans-serif; min-height: 100vh; padding: 20px; }
  .header { max-width: 600px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { color: #ffd54f; font-size: 22px; }
  .header a { color: #94a3b8; text-decoration: none; font-size: 14px; }
  
  .setup-box { max-width: 600px; margin: 0 auto 24px; background: #16213e; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
  .setup-box textarea { width: 100%; height: 120px; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-family: inherit; outline: none; resize: vertical; margin-bottom: 12px; }
  .setup-box .row { display: flex; gap: 10px; align-items: center; }
  .setup-box input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; }
  .setup-box button { flex: 1; padding: 14px; border: none; border-radius: 8px; background: #ffd54f; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; }
  .setup-box button:active { transform: scale(.98); }
  
  .result-area { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  .group-card { background: #1e293b; border-top: 4px solid #ffd54f; border-radius: 8px; padding: 16px; }
  .group-card h3 { font-size: 15px; color: #ffd54f; margin-bottom: 12px; border-bottom: 1px dashed #475569; padding-bottom: 8px; }
  .group-member { font-size: 16px; color: #fff; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.9); color: #ffd54f; padding: 12px 24px; border-radius: 30px; font-size: 14px; border: 1px solid #ffd54f; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="header"><h1>🎲 抽签分组</h1><a href="/">← 返回聊天室</a></div>

<div class="setup-box">
  <textarea id="names" placeholder="输入名单（每行一个名字，或空格/逗号隔开）&#10;例如：&#10;张三&#10;李四&#10;王五"></textarea>
  <div class="row">
    <input type="number" id="groupCount" placeholder="分成几组？(默认2组)" min="2" max="10">
    <button onclick="__draw()">开始抽签</button>
  </div>
</div>

<div class="result-area" id="result"></div>
<div id="toast"></div>

<script>
const token = localStorage.getItem('token');
if (!token) location.href = '/';
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

window.__draw = async function() {
  const text = document.getElementById('names').value.trim();
  const groupCount = parseInt(document.getElementById('groupCount').value) || 2;
  
  if (!text) return toast('请先输入名单');
  
  // 按换行、空格、逗号拆分
  const names = text.split(/[\n,，\s]+/).filter(n => n.trim().length > 0);
  if (names.length < 2) return toast('至少需要2个人');

  const btn = document.querySelector('.setup-box button');
  btn.disabled = true; btn.textContent = '抽签中...';

  try {
    const d = await fetch('/api/group/draw', {
      method: 'POST', headers: { Authorization: token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ names, groupCount })
    }).then(r => r.json());
    
    if (d.ok) {
      document.getElementById('result').innerHTML = d.groups.map((g, i) => `
        <div class="group-card">
          <h3>第 ${i + 1} 组</h3>
          ${g.map(name => `<div class="group-member">${name}</div>`).join('')}
        </div>
      `).join('');
    } else {
      toast(d.msg);
    }
  } catch (e) {
    toast('网络错误');
  } finally {
    btn.disabled = false; btn.textContent = '开始抽签';
  }
};
</script>
</body>
</html>
