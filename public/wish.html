<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌟 赛博许愿池</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: linear-gradient(160deg, #001f3f, #003366, #000); color: #e0f7fa; font-family: -apple-system, "PingFang SC", sans-serif; min-height: 100vh; padding: 20px; }
  .header { max-width: 560px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { color: #4dd0e1; font-size: 22px; }
  .header a { color: #80deea; text-decoration: none; font-size: 14px; }
  .panel { max-width: 560px; margin: 0 auto 16px; background: rgba(0,51,102,.4); border: 2px solid #00acc1; border-radius: 16px; padding: 20px; }
  .panel h2 { color: #4dd0e1; font-size: 17px; margin-bottom: 12px; }
  textarea { width: 100%; height: 80px; padding: 12px; border-radius: 10px; border: 2px solid #00838f; background: #001a2e; color: #fff; font-size: 15px; outline: none; resize: none; font-family: inherit; }
  textarea:focus { border-color: #4dd0e1; }
  button { margin-top: 10px; padding: 12px 24px; border: none; border-radius: 10px; background: linear-gradient(135deg, #00acc1, #006064); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:active { transform: scale(.97); }
  .wish { background: rgba(0,0,0,.3); border-radius: 12px; padding: 14px; margin-bottom: 10px; border-left: 4px solid #00acc1; }
  .wish.granted { border-left-color: #ffd54f; background: rgba(255,213,79,.1); }
  .wish .text { font-size: 15px; color: #fff; margin-bottom: 8px; line-height: 1.5; }
  .wish .meta { display: flex; justify-content: space-between; font-size: 12px; color: #80deea; }
  .wish .actions { margin-top: 8px; display: flex; gap: 8px; }
  .wish .actions button { padding: 6px 12px; font-size: 12px; margin: 0; }
  .wish .grant-btn { background: linear-gradient(135deg, #ffd54f, #ff9800); color: #000; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { flex: 1; padding: 10px; text-align: center; background: rgba(0,0,0,.3); border-radius: 10px; cursor: pointer; font-size: 14px; }
  .tab.active { background: #00acc1; color: #000; font-weight: 700; }
  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.9); color: #4dd0e1; padding: 12px 24px; border-radius: 30px; font-size: 14px; border: 1px solid #00acc1; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; }
  #toast.show { opacity: 1; }
</style>
  <script src="/esc.js"></script>
</head>
<body>
<div class="header"><h1>🌟 赛博许愿池</h1><a href="/">← 返回聊天室</a></div>
<div class="panel">
  <h2>✍️ 许个愿（10🍊）</h2>
  <textarea id="wishText" placeholder="写下你的愿望...（最多 100 字）" maxlength="100"></textarea>
  <button onclick="__wish()">🌟 投币许愿</button>
</div>
<div class="panel">
  <div class="tabs">
    <div class="tab active" onclick="__switchSort('new')">🕐 最新</div>
    <div class="tab" onclick="__switchSort('hot')">🔥 最热</div>
  </div>
  <div id="list">加载中...</div>
</div>
<div id="toast"></div>
<script>
const token = localStorage.getItem('token');
if (!token) location.href = '/';
let sortBy = 'new';
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
window.__switchSort = function(s) {
  sortBy = s;
  document.querySelectorAll('.tab').forEach((el, i) => el.classList.toggle('active', (i === 0 && s === 'new') || (i === 1 && s === 'hot')));
  load();
};
function load() {
  fetch('/api/wish/list?sort=' + sortBy, { headers: { Authorization: token } }).then(r => r.json()).then(d => {
    if (!d.ok) return;
    const list = document.getElementById('list');
    if (!d.wishes.length) { list.innerHTML = '<div style="color:#80deea;text-align:center;padding:20px">还没有人许愿，来当第一个！</div>'; return; }
    list.innerHTML = d.wishes.map(w => {
      const granted = w.granted ? ' granted' : '';
      const grantBadge = w.granted ? ' 🌟已显灵' : '';
      const isMac = localStorage.getItem('username') === 'mac';
      return '<div class="wish' + granted + '">' +
        '<div class="text">' + w.text.replace(/</g, '&lt;') + grantBadge + '</div>' +
        '<div class="meta"><span>—— ' + (w.displayName || w.username) + '</span><span>❤️ ' + w.likes + '</span></div>' +
        '<div class="actions"><button onclick="__like(\'' + w.id + '\')">❤️ 点赞</button>' +
        (isMac && !w.granted ? '<button class="grant-btn" onclick="__grant(\'' + w.id + '\')">🌟 显灵</button>' : '') +
        '</div></div>';
    }).join('');
  });
}
window.__wish = async function() {
  const text = document.getElementById('wishText').value.trim();
  if (!text) return toast('先写愿望');
  const d = await fetch('/api/wish', { method: 'POST', headers: { Authorization: token, 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) }).then(r => r.json());
  if (d.ok) { toast('🌟 许愿成功，-10🍊'); document.getElementById('wishText').value = ''; load(); }
  else toast('❌ ' + d.msg);
};
window.__like = async function(id) {
  const d = await fetch('/api/wish/' + id + '/like', { method: 'POST', headers: { Authorization: token } }).then(r => r.json());
  if (d.ok) load();
};
window.__grant = async function(id) {
  if (!confirm('确定显灵这个愿望？')) return;
  const d = await fetch('/api/wish/' + id + '/grant', { method: 'POST', headers: { Authorization: token } }).then(r => r.json());
  if (d.ok) { toast('🌟 已显灵！'); load(); }
  else toast('❌ ' + d.msg);
};
const socket = io({ auth: { token } });
window.socket = socket; // [橘域网修复] 统一暴露全局
socket.on('wish_new', d => { toast('🌟 ' + d.displayName + ' 许了个愿'); if (sortBy === 'new') load(); });
socket.on('wish_granted', d => toast('🌟 ' + d.displayName + ' 的愿望显灵了！'));
load();
</script>
</body>
</html>
