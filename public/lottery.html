<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎰 橘子抽奖机</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, #4a148c 0%, #1a0033 60%, #000 100%);
    color: #fff; font-family: -apple-system, "PingFang SC", sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  .top-bar { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .top-bar h1 { margin: 0; font-size: 20px; color: #ffd700; text-shadow: 0 0 12px #ffd700; }
  .top-bar a { color: #ffd700; text-decoration: none; font-size: 14px; }
  .status-bar { width: 100%; max-width: 480px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,215,0,.3); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .status-bar .bal { color: #ffd700; font-weight: 700; font-size: 16px; }
  .status-bar .buff { color: #69f0ae; }
  .machine {
    width: 100%; max-width: 480px; background: linear-gradient(160deg, #6a1b9a, #311b92);
    border: 3px solid #ffd700; border-radius: 20px; padding: 24px 20px;
    box-shadow: 0 0 40px rgba(255,215,0,.3); text-align: center; margin-bottom: 18px;
  }
  .machine .screen {
    background: #000; border: 2px solid #ffd700; border-radius: 12px;
    height: 120px; display: flex; align-items: center; justify-content: center;
    font-size: 56px; margin-bottom: 18px; transition: transform .2s;
  }
  .machine .screen.spin { animation: spin .6s linear infinite; }
  @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
  .machine .result-name { font-size: 16px; color: #ffd700; min-height: 22px; margin-bottom: 14px; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btns button {
    padding: 12px 20px; border: none; border-radius: 8px; font-size: 15px;
    font-weight: 700; cursor: pointer; transition: transform .1s;
  }
  .btns button:active { transform: scale(.95); }
  .btns button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-free { background: #43a047; color: #fff; }
  .btn-single { background: #ffd700; color: #4a148c; }
  .btn-ten { background: #e91e63; color: #fff; }
  .pool { width: 100%; max-width: 480px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,215,0,.25); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .pool h3 { margin: 0 0 10px; font-size: 14px; color: #ffd700; }
  .pool-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; color: #ddd; border-bottom: 1px solid rgba(255,255,255,.06); }
  .pool-row:last-child { border-bottom: none; }
  .pool-row .pct { color: #ffd700; font-weight: 700; }
  .history { width: 100%; max-width: 480px; font-size: 13px; color: #bbb; }
  .history h3 { margin: 0 0 8px; font-size: 14px; color: #ffd700; }
  .history div { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.9); color: #ffd700; padding: 12px 24px; border-radius: 30px; font-size: 14px; border: 1px solid #ffd700; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; }
  #toast.show { opacity: 1; }
</style>
  <script src="/esc.js"></script>
</head>
<body>

<div class="top-bar">
  <h1>🎰 橘子抽奖机</h1>
  <a href="/">← 返回</a>
</div>

<div class="status-bar" id="status-bar">
  <span>余额：<span class="bal" id="bal">--</span> 🍊</span>
  <span id="buff-info"></span>
</div>

<div class="machine">
  <div class="screen" id="screen">🎰</div>
  <div class="result-name" id="result-name">准备好了吗？</div>
  <div class="btns">
    <button class="btn-free" id="btn-free">🎁 每日免费</button>
    <button class="btn-single" id="btn-single">单抽 50🍊</button>
    <button class="btn-ten" id="btn-ten">十连 450🍊</button>
  </div>
</div>

<div class="pool">
  <h3>📋 奖池一览（基础概率）</h3>
  <div style="font-size: 12px; color: #aaa; margin-bottom: 10px;">💡 提示：吃龙虾获得的 buff，会将“谢谢惠顾”的概率转移给“好食材”哦！</div>
  <div id="pool-list"></div>
</div>

<div class="history">
  <h3>📜 最近抽奖</h3>
  <div id="history-list">（还没有抽奖记录）</div>
</div>

<div id="toast"></div>

<script>
(function(){
  var token = localStorage.getItem('token');
  if (!token) { location.href = '/'; return; }
  var H = { 'Authorization': token, 'Content-Type': 'application/json' };
  var history = [];
  var busy = false;

  function $(id){ return document.getElementById(id); }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2000);
  }

  function fmtBuff(buff) {
    if (!buff) return '';
    return '🦞 好运 x' + buff.stack + ' · 剩 ' + buff.remainMin + ' 分钟';
  }

  function refreshInfo() {
    fetch('/api/lottery/info', { headers: H })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok) return;
        $('bal').textContent = d.oranges;
        $('buff-info').innerHTML = fmtBuff(d.buff);
        $('btn-free').disabled = !d.freeAvailable;
        $('btn-free').textContent = d.freeAvailable ? '🎁 每日免费' : '🎁 明天再来';
        $('btn-single').disabled = false;
        $('btn-ten').disabled = false;
        if (!history.length) {
          $('pool-list').innerHTML = d.pool.map(function(p){
            return '<div class="pool-row"><span>' + p.emoji + ' ' + p.name + '</span><span class="pct">' + p.p + '%</span></div>';
          }).join('');
        }
      });
  }

  function addHistory(prize) {
    history.unshift(prize);
    if (history.length > 10) history.pop();
    $('history-list').innerHTML = history.map(function(p){
      return '<div>' + (p.emoji || '') + ' ' + (p.name || '') + '</div>';
    }).join('');
  }

  function spinAnimation(callback) {
    var screen = $('screen');
    screen.classList.add('spin');
    var symbols = ['🍊','🥩','🐟','🦞','🥬','💨','💰','👑','🍫'];
    var n = 0;
    var timer = setInterval(function(){
      screen.textContent = symbols[n % symbols.length];
      n++;
    }, 80);
    setTimeout(function(){
      clearInterval(timer);
      screen.classList.remove('spin');
      callback();
    }, 1200);
  }

  function draw(mode) {
    if (busy) return;
    busy = true;
    $('btn-free').disabled = true;
    $('btn-single').disabled = true;
    $('btn-ten').disabled = true;
    $('result-name').textContent = '抽奖中…';

    fetch('/api/lottery/draw', { method: 'POST', headers: H, body: JSON.stringify({ mode: mode }) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        spinAnimation(function(){
          if (!d.ok) {
            $('screen').textContent = '❌';
            $('result-name').textContent = d.msg || '抽奖失败';
            toast(d.msg || '抽奖失败');
          } else {
            var first = d.results[0];
            $('screen').textContent = first.emoji || '🎁';
            if (d.results.length > 1) {
              $('result-name').textContent = d.results.map(function(p){ return p.name; }).join(' · ');
            } else {
              $('result-name').textContent = first.name;
            }
            d.results.forEach(addHistory);
            if (d.oranges !== undefined) $('bal').textContent = d.oranges;
            // 大奖提示
            var big = d.results.find(function(p){ return p.id === 'legend' || p.id === 'orange500'; });
            if (big) toast('🎉 恭喜抽中 ' + big.name + '！');
          }
          busy = false;
          $('btn-single').disabled = false;
          $('btn-ten').disabled = false;
          refreshInfo();
        });
      })
      .catch(function(){
        $('result-name').textContent = '网络错误';
        toast('网络错误');
        busy = false;
      });
  }

  $('btn-free').onclick = function(){ draw('free'); };
  $('btn-single').onclick = function(){ draw('single'); };
  $('btn-ten').onclick = function(){ draw('ten'); };

  refreshInfo();
  setInterval(refreshInfo, 30000);

  // 监听别人中大奖
  if (window.io) {
    var s = io({ auth: { token: token } });
    s.on('lottery_win', function(d){
      toast('🎉 ' + (d.displayName || d.username) + ' 抽中了 ' + d.prize.name + '！');
    });
  }
})();
</script>
</body>
</html>
