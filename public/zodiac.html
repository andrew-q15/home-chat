<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎊 十二生肖跳舞</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 30%, #8b0000 0%, #4a0000 60%, #1a0000 100%);
    color: #ffd700;
    font-family: -apple-system, "PingFang SC", sans-serif;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px;
  }
  h1 { font-size: 22px; margin: 12px 0 4px; text-shadow: 0 0 12px #ffd700; }
  #countdown { font-size: 14px; color: #ffecb3; margin-bottom: 8px; }
  #stage {
    position: relative;
    width: min(92vw, 420px);
    height: min(92vw, 420px);
    margin-top: 8px;
  }
  .zodiac {
    position: absolute;
    font-size: 38px;
    cursor: pointer;
    transition: transform .15s;
    user-select: none;
    filter: drop-shadow(0 0 6px rgba(255,215,0,.6));
  }
  .zodiac:hover { transform: scale(1.3) !important; }
  .zodiac:active { transform: scale(1.5) !important; }

  /* 12 种不同节奏的跳舞动画 */
  @keyframes dance1 { 0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-14px) rotate(6deg)} }
  @keyframes dance2 { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-10px) scale(1.15)} }
  @keyframes dance3 { 0%,100%{transform:rotate(-12deg)} 50%{transform:rotate(12deg)} }
  @keyframes dance4 { 0%,100%{transform:translateX(-6px) rotate(-4deg)} 50%{transform:translateX(6px) rotate(4deg)} }
  @keyframes dance5 { 0%,25%,75%,100%{transform:translateY(0)} 50%{transform:translateY(-18px) rotate(8deg)} }
  @keyframes dance6 { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25) rotate(-8deg)} }

  /* 金色飘落粒子 */
  .spark {
    position: fixed; top: -20px; width: 6px; height: 6px;
    background: #ffd700; border-radius: 50%; pointer-events: none;
    animation: fall linear infinite; opacity: .8;
  }
  @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }

  /* 祝福弹窗 */
  #bless {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.7); z-index: 100;
  }
  #bless.show { display: flex; }
  #bless-box {
    background: linear-gradient(145deg, #b71c1c, #7f0000);
    border: 2px solid #ffd700; border-radius: 16px;
    padding: 30px 36px; text-align: center;
    box-shadow: 0 0 40px rgba(255,215,0,.5);
    animation: pop .3s ease;
  }
  @keyframes pop { from{transform:scale(.6);opacity:0} to{transform:scale(1);opacity:1} }
  #bless-box .big { font-size: 64px; margin-bottom: 12px; }
  #bless-box .msg { font-size: 18px; color: #fff8e1; margin-bottom: 20px; }
  #bless-box button {
    padding: 10px 28px; background: #ffd700; color: #7f0000;
    border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer;
  }
  #back {
    margin-top: auto; padding: 10px 28px;
    background: transparent; color: #ffd700;
    border: 1px solid #ffd700; border-radius: 8px;
    cursor: pointer; font-size: 14px;
  }
</style>
  <script src="/esc.js"></script>
</head>
<body>
  <h1>🎊 十二生肖跳舞 🎊</h1>
  <div id="countdown"></div>
  <div id="stage"></div>
  <button id="back" onclick="location.href='/'">← 返回主页</button>

  <div id="bless">
    <div id="bless-box">
      <div class="big" id="bless-emoji"></div>
      <div class="msg" id="bless-msg"></div>
      <button onclick="document.getElementById('bless').classList.remove('show')">收下祝福</button>
    </div>
  </div>

<script>
  const ZODIAC = [
    { e: '🐭', n: '鼠', w: '机灵聪慧，新年大吉！' },
    { e: '🐮', n: '牛', w: '牛气冲天，万事顺遂！' },
    { e: '🐯', n: '虎', w: '虎虎生威，勇往直前！' },
    { e: '🐰', n: '兔', w: '前兔似锦，平安喜乐！' },
    { e: '🐲', n: '龙', w: '龙腾四海，大展宏图！' },
    { e: '🐍', n: '蛇', w: '灵蛇献瑞，吉祥如意！' },
    { e: '🐴', n: '马', w: '马到成功，一路顺风！' },
    { e: '🐑', n: '羊', w: '喜气洋洋，幸福安康！' },
    { e: '🐵', n: '猴', w: '猴运当头，聪明伶俐！' },
    { e: '🐔', n: '鸡', w: '金鸡报晓，好运连连！' },
    { e: '🐶', n: '狗', w: '旺旺迎春，忠犬送福！' },
    { e: '🐷', n: '猪', w: '猪事顺利，福气满满！' },
  ];

  const stage = document.getElementById('stage');
  const R = 140;
  const cx = 0.5, cy = 0.5;

  ZODIAC.forEach((z, i) => {
    const angle = (i / 12) * Math.PI * 2 - Math.PI / 2;
    const x = 50 + (R / 2) * Math.cos(angle);
    const y = 50 + (R / 2) * Math.sin(angle);
    const el = document.createElement('div');
    el.className = 'zodiac';
    el.textContent = z.e;
    el.style.left = `calc(${x}% - 19px)`;
    el.style.top = `calc(${y}% - 22px)`;
    const anim = (i % 6) + 1;
    const dur = 0.7 + (i % 5) * 0.15;
    el.style.animation = `dance${anim} ${dur}s ease-in-out ${i * 0.08}s infinite`;
    el.title = z.n;
    el.onclick = () => {
      document.getElementById('bless-emoji').textContent = z.e;
      document.getElementById('bless-msg').textContent = z.n + '：' + z.w;
      document.getElementById('bless').classList.add('show');
    };
    stage.appendChild(el);
  });

  // 金色粒子
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (3 + Math.random() * 5) + 's';
    s.style.animationDelay = (Math.random() * 5) + 's';
    document.body.appendChild(s);
  }

  // 倒计时
  function updateCountdown() {
    const now = new Date();
    const target = new Date(now.getFullYear() + 1, 0, 1);
    const days = Math.ceil((target - now) / 86400000);
    document.getElementById('countdown').textContent =
      `距离 ${target.getFullYear()} 元旦还有 ${days} 天 🎉`;
  }
  updateCountdown();
  setInterval(updateCountdown, 3600000);
</script>
</body>
</html>
