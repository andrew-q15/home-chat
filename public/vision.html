<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视觉哨兵</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #1a1a1a; color: #eee; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 12px 16px; background: #2c2c2c; display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 16px; }
  header .status { font-size: 13px; color: #888; }
  #stage { flex: 1; position: relative; overflow: hidden; background: #000; }
  #video { width: 100%; height: 100%; object-fit: contain; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
  #flash.on { opacity: 0.6; }
  #log { position: absolute; left: 12px; bottom: 12px; right: 12px; background: rgba(0,0,0,0.7); color: #0f0; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-family: monospace; max-height: 120px; overflow-y: auto; pointer-events: none; display: none; }
  #log div { padding: 2px 0; }
  footer { padding: 10px 16px; background: #2c2c2c; display: flex; gap: 10px; justify-content: center; align-items: center; }
  button { padding: 12px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
  #btn-shoot { background: #e74c3c; color: #fff; }
  #btn-shoot:disabled { opacity: 0.5; }
  #btn-switch { background: #6c757d; color: #fff; }
  #auto-toggle { color: #aaa; font-size: 13px; display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>

<header>
  <h1>视觉哨兵</h1>
  <span class="status" id="status">初始化中...</span>
</header>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <div id="flash"></div>
  <div id="log"></div>
</div>

<footer>
  <button id="btn-switch">切摄像头</button>
  <button id="btn-shoot" disabled>手动拍</button>
  <label id="auto-toggle"><input type="checkbox" id="auto"> 自动（5 分钟）</label>
</footer>

<script>
  var $ = function(id) { return document.getElementById(id); };
  var video = $('video');
  var statusEl = $('status');
  var shootBtn = $('btn-shoot');
  var switchBtn = $('btn-switch');
  var autoChk = $('auto');
  var flashEl = $('flash');
  var logEl = $('log');

  var stream = null;
  var facing = 'environment';
  var token = localStorage.getItem('token');
  var autoTimer = null;
  var shooting = false;

  function log(msg) {
    logEl.style.display = 'block';
    var line = document.createElement('div');
    line.textContent = msg;
    logEl.insertBefore(line, logEl.firstChild);
    while (logEl.children.length > 8) logEl.removeChild(logEl.lastChild);
  }

  function setStatus(t) { statusEl.textContent = t; }

  async function startCamera() {
    if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 1280 } },
        audio: false
      });
      video.srcObject = stream;
      setStatus('就绪');
      shootBtn.disabled = false;
    } catch (err) {
      setStatus('无法访问摄像头');
      log('摄像头错误: ' + err.message);
    }
  }

  switchBtn.addEventListener('click', function() {
    facing = (facing === 'environment') ? 'user' : 'environment';
    startCamera();
  });

  async function shoot() {
    if (shooting || !token) return;
    if (!video.videoWidth) return;
    shooting = true;
    shootBtn.disabled = true;
    setStatus('拍照中...');

    var canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);

    flashEl.classList.add('on');
    setTimeout(function() { flashEl.classList.remove('on'); }, 150);

    canvas.toBlob(async function(blob) {
      setStatus('AI 识别中...');
      var formData = new FormData();
      formData.append('image', blob, 'shot.jpg');

      try {
        var res = await fetch('/api/vision', {
          method: 'POST',
          headers: { 'Authorization': token },
          body: formData
        });
        var data = await res.json();
        if (data.ok) {
          setStatus('完成 ' + new Date().toLocaleTimeString());
          log(data.description);
        } else {
          setStatus('失败');
          log('错误: ' + (data.msg || '未知'));
        }
      } catch (err) {
        setStatus('网络错误');
        log('网络错误: ' + err.message);
      }
      shootBtn.disabled = false;
      shooting = false;
    }, 'image/jpeg', 0.8);
  }

  shootBtn.addEventListener('click', shoot);

  autoChk.addEventListener('change', function() {
    if (autoChk.checked) {
      if (autoTimer) clearInterval(autoTimer);
      autoTimer = setInterval(shoot, 5 * 60 * 1000);
      log('自动模式开启：每 5 分钟一张');
      shoot();
    } else {
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
      log('自动模式关闭');
    }
  });

  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
      if (autoChk.checked) log('页面已后台，自动暂停');
    } else {
      if (autoChk.checked && !autoTimer) {
        autoTimer = setInterval(shoot, 5 * 60 * 1000);
        log('回到前台，自动恢复');
      }
    }
  });

  if (!token) {
    setStatus('未登录');
    log('请先在聊天室登录一次，再回到此页面');
  }
  startCamera();
</script>
</body>
</html>
