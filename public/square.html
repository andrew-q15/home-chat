<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📸 图文广场</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; font-family: -apple-system, "PingFang SC", sans-serif; padding-bottom: 60px; }
  .header { position: sticky; top: 0; background: #fff; padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.05); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
  .header h1 { font-size: 18px; color: #333; }
  .header a { color: #666; text-decoration: none; font-size: 14px; }
  .fab { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; background: #ff2442; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 4px 12px rgba(255,36,66,0.4); cursor: pointer; z-index: 100; }
  
  /* 瀑布流容器 */
  .grid { padding: 10px; column-count: 2; column-gap: 10px; }
  @media (min-width: 600px) { .grid { column-count: 3; } }
  @media (min-width: 900px) { .grid { column-count: 4; } }

  .card { background: #fff; border-radius: 10px; overflow: hidden; margin-bottom: 10px; break-inside: avoid; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .card-img { width: 100%; display: block; object-fit: cover; min-height: 150px; }
  .card-body { padding: 10px; }
  .card-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #999; margin-top: 8px; }
  .author { display: flex; align-items: center; gap: 4px; }
  .author img { width: 20px; height: 20px; border-radius: 50%; background: #ddd; }
  .like { cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .like.active { color: #ff2442; }

  /* 发帖弹窗 */
  #post-modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
  #post-box { background: #fff; border-radius: 12px; width: 100%; max-width: 500px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
  .post-header { padding: 16px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
  .post-body { padding: 16px; overflow-y: auto; flex: 1; }
  .post-body input, .post-body textarea { width: 100%; border: none; outline: none; font-size: 15px; margin-bottom: 12px; font-family: inherit; }
  .post-body textarea { resize: none; height: 100px; }
  .img-preview { display: flex; flex-wrap: wrap; gap: 8px; }
  .img-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; }
  .upload-btn { width: 80px; height: 80px; border: 1px dashed #ccc; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #999; font-size: 24px; cursor: pointer; }
  .post-footer { padding: 16px; border-top: 1px solid #eee; }
  .post-footer button { width: 100%; background: #ff2442; color: #fff; border: none; padding: 12px; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer; }
  
  /* 详情弹窗 */
  #detail-modal { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
  #detail-box { background: #fff; border-radius: 12px; width: 90%; max-width: 600px; height: 80vh; display: flex; flex-direction: column; overflow: hidden; }
  .detail-imgs { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; }
  .detail-imgs img { width: 100%; flex-shrink: 0; object-fit: contain; scroll-snap-align: center; background: #000; max-height: 40vh; }
  .detail-content { padding: 16px; flex: 1; overflow-y: auto; }
  .comments-list { margin-top: 16px; border-top: 1px solid #eee; padding-top: 16px; }
  .comment { display: flex; gap: 8px; margin-bottom: 12px; font-size: 13px; }
  .comment .c-name { font-weight: bold; color: #333; }
  .detail-input { padding: 12px; border-top: 1px solid #eee; display: flex; gap: 8px; }
  .detail-input input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 8px 16px; outline: none; }
  .detail-input button { background: #ff2442; color: #fff; border: none; padding: 0 16px; border-radius: 20px; cursor: pointer; }
</style>
  <script src="/esc.js"></script>
</head>
<body>

<div class="header">
  <h1>📸 图文广场</h1>
  <a href="/">← 返回聊天室</a>
</div>

<div class="grid" id="grid"></div>

<div class="fab" onclick="__openPost()">+</div>

<!-- 发帖弹窗 -->
<div id="post-modal">
  <div id="post-box">
    <div class="post-header">
      <span>发布新帖子</span>
      <span style="cursor:pointer;color:#999;" onclick="document.getElementById('post-modal').style.display='none'">✕</span>
    </div>
    <div class="post-body">
      <input type="text" id="post-title" placeholder="填写标题会有更多人看哦~" maxlength="50">
      <textarea id="post-content" placeholder="分享你的新鲜事..."></textarea>
      <div class="img-preview" id="img-preview">
        <div class="upload-btn" onclick="document.getElementById('post-file').click()">+</div>
      </div>
      <input type="file" id="post-file" accept="image/*" multiple style="display:none" onchange="__handleFiles(this.files)">
    </div>
    <div class="post-footer">
      <button onclick="__submitPost()">发布</button>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div id="detail-modal">
  <div id="detail-box">
    <div class="post-header">
      <span>帖子详情</span>
      <span style="cursor:pointer;color:#999;" onclick="document.getElementById('detail-modal').style.display='none'">✕</span>
    </div>
    <div class="detail-imgs" id="detail-imgs"></div>
    <div class="detail-content">
      <h2 style="font-size:16px;margin-bottom:8px;" id="detail-title"></h2>
      <p style="font-size:14px;color:#555;white-space:pre-wrap;" id="detail-content-text"></p>
      <div style="font-size:12px;color:#999;margin-top:12px;display:flex;justify-content:space-between;">
        <span id="detail-author"></span>
        <span id="detail-time"></span>
      </div>
      <div class="comments-list" id="detail-comments"></div>
    </div>
    <div class="detail-input">
      <input type="text" id="comment-input" placeholder="说点什么...">
      <button onclick="__submitComment()">发送</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let myToken = localStorage.getItem('token');
let myName = localStorage.getItem('username') || '';
let postsData = [];
let currentPostId = null;
let uploadedImages = [];

const socket = io({ auth: { token: myToken } });
window.socket = socket; // [橘域网修复] 统一暴露全局

socket.on('posts_updated', (posts) => {
  postsData = posts;
  renderGrid();
});

// 首次拉取
fetch('/api/posts').then(r=>r.json()).then(d => {
  if (d.ok) { postsData = d.posts; renderGrid(); }
});

function esc(t) {
  return String(t||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = postsData.map(p => {
    const liked = p.likes.includes(myName);
    const likeClass = liked ? 'active' : '';
    const heart = liked ? '❤️' : '🤍';
    const firstImg = p.images[0] ? p.images[0] : '';
    return `
      <div class="card" onclick="__openDetail('${p.id}')">
        <img class="card-img" src="${firstImg}" loading="lazy">
        <div class="card-body">
          <div class="card-title">${esc(p.title)}</div>
          <div class="card-footer">
            <div class="author">
              <img src="${p.authorAvatar || 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 20%22><circle cx=%2210%22 cy=%2210%22 r=%2210%22 fill=%22%23ddd%22/></svg>'}">
              <span>${esc(p.authorName)}</span>
            </div>
            <div class="like ${likeClass}" onclick="event.stopPropagation(); __toggleLike('${p.id}')">
              ${heart} ${p.likes.length}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// --- 发帖逻辑 ---
window.__openPost = function() {
  document.getElementById('post-modal').style.display = 'flex';
  uploadedImages = [];
  document.getElementById('post-title').value = '';
  document.getElementById('post-content').value = '';
  document.getElementById('img-preview').innerHTML = '<div class="upload-btn" onclick="document.getElementById(\'post-file\').click()">+</div>';
};

window.__handleFiles = async function(files) {
  if (!files.length) return;
  const preview = document.getElementById('img-preview');
  for (let i=0; i<files.length; i++) {
    if (uploadedImages.length >= 9) { alert('最多9张图'); break; }
    const fd = new FormData();
    fd.append('file', files[i]);
    try {
      const res = await fetch('/api/upload', {
        method: 'POST', headers: { 'Authorization': myToken }, body: fd
      }).then(r=>r.json());
      if (res.ok) {
        uploadedImages.push(res.url);
        const img = document.createElement('img');
        img.src = res.url;
        preview.insertBefore(img, preview.lastElementChild);
      }
    } catch(e) {}
  }
};

window.__submitPost = function() {
  const title = document.getElementById('post-title').value.trim();
  const content = document.getElementById('post-content').value.trim();
  if (!title || !content) return alert('标题和正文不能为空');
  if (uploadedImages.length === 0) return alert('请至少上传一张图片');

  fetch('/api/posts', {
    method: 'POST', headers: { 'Authorization': myToken, 'Content-Type': 'application/json' },
    body: JSON.stringify({ title, content, images: uploadedImages })
  }).then(r=>r.json()).then(d => {
    if (d.ok) {
      document.getElementById('post-modal').style.display = 'none';
    } else {
      alert(d.msg);
    }
  });
};

// --- 点赞逻辑 ---
window.__toggleLike = function(id) {
  fetch('/api/posts/' + id + '/like', {
    method: 'POST', headers: { 'Authorization': myToken }
  });
};

// --- 详情页逻辑 ---
window.__openDetail = function(id) {
  const post = postsData.find(p => p.id === id);
  if (!post) return;
  currentPostId = id;
  document.getElementById('detail-modal').style.display = 'flex';
  document.getElementById('detail-title').textContent = post.title;
  document.getElementById('detail-content-text').textContent = post.content;
  document.getElementById('detail-author').textContent = '发布者：' + post.authorName;
  document.getElementById('detail-time').textContent = new Date(post.time).toLocaleString();
  
  document.getElementById('detail-imgs').innerHTML = post.images.map(src => `<img src="${src}">`).join('');
  
  renderComments(post);
};

function renderComments(post) {
  const cList = document.getElementById('detail-comments');
  if (post.comments.length === 0) {
    cList.innerHTML = '<div style="color:#999;font-size:13px;text-align:center;">还没有评论，快来抢沙发~</div>';
    return;
  }
  cList.innerHTML = post.comments.map(c => `
    <div class="comment">
      <div class="c-name">${esc(c.authorName)}:</div>
      <div style="color:#333;">${esc(c.text)}</div>
    </div>
  `).join('');
}

window.__submitComment = function() {
  const input = document.getElementById('comment-input');
  const text = input.value.trim();
  if (!text || !currentPostId) return;
  fetch('/api/posts/' + currentPostId + '/comment', {
    method: 'POST', headers: { 'Authorization': myToken, 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  }).then(r=>r.json()).then(d => {
    if (d.ok) input.value = '';
  });
};
</script>
</body>
</html>
