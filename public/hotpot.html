<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🍲 沸腾火锅</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; min-height: 100vh; background: #8b0000; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { margin: 0 0 10px; font-size: 24px; color: #ffd54f; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  .header p { margin: 0; font-size: 13px; color: #ffb3b3; }
  .header a { color: #ffd54f; text-decoration: none; display: inline-block; margin-top: 10px; }
  #pot { width: 100%; max-width: 500px; aspect-ratio: 1; background-color: #b71c1c; background-image: radial-gradient(circle at 20% 30%, rgba(255,100,0,0.3) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(255,0,0,0.4) 0%, transparent 40%), repeating-linear-gradient(45deg, rgba(0,0,0,0.1) 0, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 10px); border: 12px solid #333; border-radius: 50%; box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.6); display: grid; grid-template-columns: repeat(16, 1fr); grid-template-rows: repeat(16, 1fr); position: relative; overflow: hidden; }
  .cell { border: 1px solid rgba(255,255,255,0.05); position: relative; }
  .item { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; user-select: none; animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .item:hover { transform: scale(1.2); }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  #toast { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 12px 24px; border-radius: 30px; font-size: 16px; font-weight: bold; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  #toast.show { opacity: 1; }
  .plus { color: #4caf50; }
  .minus { color: #f44336; }
</style>
</head>
<body>
<div class="header">
  <h1>🍲 沸腾红油锅</h1>
  <p>🥩牛肉 +10 | 🥔土豆 +5 | 🥬生菜/🍄金针菇 +2 | 🫚生姜 (-10橘子)</p>
  <a href="/">← 返回聊天室</a>
</div>
<div id="pot"></div>
<div id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
(function() {
  var token = localStorage.getItem('token');
  if (!token) { alert('未登录'); location.href = '/'; }
  var socket = io({ auth: { token } });
  var potEl = document.getElementById('pot');
  var toastEl = document.getElementById('toast');
  var cells = [];
  for (var y = 0; y < 16; y++) {
    for (var x = 0; x < 16; x++) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      potEl.appendChild(cell);
      cells.push(cell);
    }
  }
  function showToast(text, isError) {
    toastEl.innerHTML = text;
    toastEl.className = isError ? 'show minus' : 'show plus';
    setTimeout(function() { toastEl.className = ''; }, 1500);
  }
  socket.on('hotpot_update', function(activeItems) {
    cells.forEach(function(c) { c.innerHTML = ''; });
    activeItems.forEach(function(item) {
      var cell = cells[item.y * 16 + item.x];
      if (!cell) return;
      var div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = item.emoji;
      div.title = item.name + ' (' + item.score + '🍊)';
      div.onclick = function() { grabItem(item.id); };
      cell.appendChild(div);
    });
  });
  function grabItem(itemId) {
    fetch('/api/hotpot/grab', {
      method: 'POST',
      headers: { 'Authorization': token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ itemId: itemId })
    }).then(function(r) { return r.json(); }).then(function(d) {
      if (d.ok) {
        if (d.score > 0) showToast('抢到啦！+' + d.score + ' 🍊', false);
        else showToast('踩雷了！' + d.score + ' 🍊', true);
      } else {
        showToast(d.msg, true);
      }
    });
  }

  // 获取库存
  function loadInventory() {
    fetch('/api/food/inventory', { headers: { 'Authorization': token } })
      .then(r => r.json()).then(d => {
        if (!d.ok) return;
        var listEl = document.getElementById('inv-list');
        var inv = d.inventory;
        var keys = Object.keys(inv);
        if (keys.length === 0) {
          listEl.innerHTML = '空空如也，快去抢火锅吧！';
          return;
        }
        var prices = { '🥩': 10, '🥔': 5, '🥬': 2, '🍄': 2, '🫚': -20 };
        listEl.innerHTML = keys.map(emoji => {
          var price = prices[emoji] || 0;
          var btnText = price > 0 ? '卖 ' + price + '🍊' : '倒贴 20🍊';
          return '<div class="inv-item">' +
            '<div><span class="emoji">' + emoji + '</span><span class="count">x ' + inv[emoji] + '</span></div>' +
            '<button onclick="sellItem(\'' + emoji + '\', 1)">' + btnText + '</button>' +
          '</div>';
        }).join('');
      });
  }

  window.sellItem = function(emoji, count) {
    fetch('/api/food/sell', {
      method: 'POST',
      headers: { 'Authorization': token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ emoji: emoji, count: count })
    }).then(r => r.json()).then(d => {
      if (d.ok) {
        showToast('卖出成功，获得 ' + d.earned + ' 🍊', false);
        loadInventory(); // 刷新库存
      } else {
        showToast(d.msg, true);
      }
    });
  };

  // 初始化加载
  loadInventory();
  // 抢菜后刷新库存
  var oldGrab = socket.listeners('hotpot_grabbed')[0];
  socket.off('hotpot_grabbed');
  socket.on('hotpot_grabbed', function(data) {
    if (oldGrab) oldGrab(data);
    loadInventory();
  });

})();
</script>

<style>
  #inventory-panel {
    width: 100%; max-width: 500px; margin-top: 20px;
    background: rgba(0,0,0,0.4); padding: 16px; border-radius: 12px;
    border: 1px solid #ffd54f; color: #fff;
  }
  #inventory-panel h3 { margin: 0 0 10px; font-size: 16px; color: #ffd54f; }
  .inv-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .inv-item:last-child { border: none; }
  .inv-item .emoji { font-size: 24px; }
  .inv-item .count { font-size: 14px; margin-left: 10px; }
  .inv-item button {
    background: #4caf50; color: #fff; border: none; padding: 4px 12px;
    border-radius: 4px; cursor: pointer;
  }
  .inv-item button:hover { background: #388e3c; }
</style>
<div id="inventory-panel">
  <h3>🧺 我的食材库存</h3>
  <div id="inv-list" style="font-size:14px;color:#aaa;">加载中...</div>
</div>

<script src="/invite.js"></script>
</body>
</html>
