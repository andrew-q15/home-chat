name: CI/CD - Build & Deploy

on:
  push:
    branches: [ main, master, docker-trial ]
  pull_request:
    branches: [ main, master, docker-trial ]

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: orange-network
  IMAGE_NAME: chat

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: 全站 JS 语法自检
        run: |
          for f in $(find . -maxdepth 1 -name '*.js' -not -name 'security-check.js' -not -name 'atomic-fs.js'); do
            node --check "$f" || exit 1
          done
          echo "PASS 全部 .js 语法通过"

      - name: Docker 构建测试
        run: docker build -t orange-test .

  deploy:
    name: Deploy to Aliyun
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASS }}

      - name: 构建推送
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: 部署到 ECS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            REG=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest

            docker login ${{ env.REGISTRY }} -u '${{ secrets.ALIYUN_REGISTRY_USER }}' -p '${{ secrets.ALIYUN_REGISTRY_PASS }}'
            docker pull "$REG"

            docker stop orange-chat orange-backup orange-report 2>/dev/null || true
            docker rm orange-chat orange-backup orange-report 2>/dev/null || true

            # 把 /home/deploy/data/ 下所有状态 JSON 自动挂到 /app/ 同名位置，新增模块无需改流水线
            MOUNTS=""
            for f in /home/deploy/data/*.json; do
              [ -e "$f" ] || continue
              MOUNTS="$MOUNTS -v $f:/app/$(basename $f):rw"
            done

            docker run -d --name orange-chat --restart unless-stopped \
              -p 127.0.0.1:3000:3000 $MOUNTS \
              -v /home/deploy/data/backups:/app/backups:rw \
              -e NODE_ENV=production -e PORT=3000 \
              -e TAILSCALE_KEY='${{ secrets.TAILSCALE_KEY }}' \
              -e DEVICE_API_KEY='${{ secrets.DEVICE_API_KEY }}' \
              -e AI_URL='${{ secrets.AI_URL }}' \
              "$REG"

            docker run -d --name orange-backup --restart unless-stopped $MOUNTS \
              -v /home/deploy/data/backups:/app/backups:rw \
              "$REG" node backup.js

            docker run -d --name orange-report --restart unless-stopped \
              "$REG" node morning-report.js

            for i in 1 2 3 4 5 6; do
              curl -sf -X POST http://127.0.0.1:3000/api/verify > /dev/null && break
              sleep 3
            done
            curl -sf -X POST http://127.0.0.1:3000/api/verify > /dev/null || (docker logs orange-chat && exit 1)

            docker image prune -f
            echo "done"
