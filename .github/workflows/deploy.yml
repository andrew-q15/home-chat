name: CI/CD - Build & Deploy

on:
  push:
    branches: [ main, master, docker-trial ]
  pull_request:
    branches: [ main, master, docker-trial ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: 全站 JS 语法自检
        run: |
          for f in $(find . -maxdepth 1 -name '*.js' -not -name 'security-check.js' -not -name 'atomic-fs.js'); do
            node --check "$f" || exit 1
          done
          echo "PASS 全部 .js 语法通过"

      # 让 FROM node:24-alpine 也走认证额度，避开 runner 共享 IP 的匿名 100/6h 限额
      - name: 登录 Docker Hub
        if: github.event_name == 'push'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 构建测试
        run: docker build -t orange-test .

  deploy:
    name: Deploy to Aliyun
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建推送
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/orange-chat:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/orange-chat:${{ github.sha }}

      - name: 部署到轻量服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            IMG='${{ secrets.DOCKERHUB_USERNAME }}/orange-chat:latest'

            # 服务器首次已在块 2 里 docker login，凭据存于 ~/.docker/config.json
            # 国内直连 Docker Hub 会抖，重试 3 次
            pulled=0
            for i in 1 2 3; do
              if docker pull "$IMG"; then pulled=1; break; fi
              sleep 10
            done
            [ "$pulled" = "1" ] || { echo "docker pull 三次失败"; exit 1; }

            docker stop orange-chat orange-backup orange-report 2>/dev/null || true
            docker rm orange-chat orange-backup orange-report 2>/dev/null || true

            MOUNTS=""
            for f in /home/deploy/data/*.json; do
              [ -e "$f" ] || continue
              MOUNTS="$MOUNTS -v $f:/app/$(basename $f):rw"
            done

            docker run -d --name orange-chat --restart unless-stopped \
              -p 127.0.0.1:3000:3000 $MOUNTS \
              -v /home/deploy/data/backups:/app/backups:rw \
              -e NODE_ENV=production -e PORT=3000 \
              -e TAILSCALE_KEY='${{ secrets.TAILSCALE_KEY }}' \
              -e DEVICE_API_KEY='${{ secrets.DEVICE_API_KEY }}' \
              -e AI_URL='${{ secrets.AI_URL }}' \
              "$IMG"

            docker run -d --name orange-backup --restart unless-stopped $MOUNTS \
              -v /home/deploy/data/backups:/app/backups:rw \
              "$IMG" node backup.js

            docker run -d --name orange-report --restart unless-stopped \
              "$IMG" node morning-report.js

            for i in 1 2 3 4 5 6; do
              curl -sf -X POST http://127.0.0.1:3000/api/verify > /dev/null && break
              sleep 3
            done
            curl -sf -X POST http://127.0.0.1:3000/api/verify > /dev/null || (docker logs orange-chat && exit 1)

            docker image prune -f
            echo "done"
